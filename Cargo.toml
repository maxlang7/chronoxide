[package]
name = "calendar-tui"
version = "0.2.0"
edition = "2021"
description = "A compact Google Calendar week view for the terminal"
license = "MIT"
repository = "https://github.com/maxlang7/calendar-tui"
readme = "README.md"
keywords = ["calendar", "google-calendar", "tui", "terminal"]
categories = ["command-line-utilities"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "docs/preview.svg"]
[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
fs2 = "0.4"
